name: Android CI - Js TV Remote

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Js TV Remote
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Instalar Gradle 8.13
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # 4. Reparar automáticamente "app 2" si existe
      - name: Fix app folder
        shell: bash
        run: |
          echo "Checking Android project structure..."

          if [ -d "app 2" ] && [ ! -d "app" ]; then
            mv "app 2" app
            echo "✓ Renamed app 2 -> app"
          elif [ -d "app" ]; then
            echo "✓ app folder already exists"
          else
            echo "ERROR: No app folder found."
            echo ""
            echo "Root directory:"
            ls -la
            exit 1
          fi

      # 5. Verificar archivos principales
      - name: Check project
        shell: bash
        run: |
          echo "Checking required files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src

          echo "✓ settings.gradle.kts"
          echo "✓ build.gradle.kts"
          echo "✓ app/build.gradle.kts"
          echo "✓ app/src"

      # 6. Mostrar versiones
      - name: Show versions
        run: |
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

      # 7. Limpiar proyecto
      - name: Clean
        run: gradle clean --no-daemon --stacktrace

      # 8. Lint
      - name: Run Lint
        run: gradle :app:lint --no-daemon --stacktrace

      # 9. APK Debug
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # 10. APK Release
      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # 11. AAB para Google Play
      - name: Build Release AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      # 12. Mostrar archivos generados
      - name: Show build outputs
        shell: bash
        run: |
          echo "Generated files:"
          find app/build/outputs -type f | sort

      # 13. Guardar APK y AAB como artefactos
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: JsTvRemote-1.3.0-builds
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
