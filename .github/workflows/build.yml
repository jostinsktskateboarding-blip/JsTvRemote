name: Android CI — Js TV Remote

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Lint Android
        run: gradle lintDebug --no-daemon

      - name: Compilar APK de prueba
        run: gradle assembleDebug --no-daemon

      - name: Preparar keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d --ignore-garbage > "${{ github.workspace }}/release-keystore.jks"
          ls -la "${{ github.workspace }}/release-keystore.jks"
          file "${{ github.workspace }}/release-keystore.jks" || true

      - name: Compilar APK y AAB de release (firmados)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon
          gradle bundleRelease --no-daemon

      - name: Borrar keystore temporal
        if: always()
        run: rm -f "${{ github.workspace }}/release-keystore.jks"

      - name: Subir APKs y AAB
        uses: actions/upload-artifact@v4
        with:
          name: JsTvRemote-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
