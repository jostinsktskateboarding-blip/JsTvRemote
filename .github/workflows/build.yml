name: Android CI - Js TV Remote

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Js TV Remote 1.3.1
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────────────
      # 1. Descargar código
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4


      # ─────────────────────────────────────────────
      # 2. Java 17
      # ─────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ─────────────────────────────────────────────
      # 3. Gradle 8.13
      # ─────────────────────────────────────────────
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'


      # ─────────────────────────────────────────────
      # 4. Corregir automáticamente "app 2"
      # ─────────────────────────────────────────────
      - name: Fix app folder
        shell: bash
        run: |
          echo "Checking project folders..."

          if [ -d "app 2" ] && [ ! -d "app" ]; then
            mv "app 2" app
            echo "✓ Renamed app 2 -> app"

          elif [ -d "app" ]; then
            echo "✓ app folder already exists"

          else
            echo "ERROR: Android app folder not found."
            echo ""
            echo "Repository contents:"
            ls -la
            exit 1
          fi


      # ─────────────────────────────────────────────
      # 5. Verificar estructura
      # ─────────────────────────────────────────────
      - name: Verify project
        shell: bash
        run: |
          echo "Checking required files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -d app/src

          echo "✓ settings.gradle.kts"
          echo "✓ build.gradle.kts"
          echo "✓ app/build.gradle.kts"
          echo "✓ app/src"


      # ─────────────────────────────────────────────
      # 6. Ver versiones
      # ─────────────────────────────────────────────
      - name: Show Java and Gradle versions
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          gradle --version


      # ─────────────────────────────────────────────
      # 7. Limpiar
      # ─────────────────────────────────────────────
      - name: Clean project
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace


      # ─────────────────────────────────────────────
      # 8. Compilar Kotlin
      # ─────────────────────────────────────────────
      - name: Compile Kotlin
        run: |
          gradle :app:compileDebugKotlin \
            --no-daemon \
            --stacktrace


      # ─────────────────────────────────────────────
      # 9. Lint
      # ─────────────────────────────────────────────
      - name: Run Lint
        run: |
          gradle :app:lint \
            --no-daemon \
            --stacktrace


      # ─────────────────────────────────────────────
      # 10. APK DEBUG
      # ─────────────────────────────────────────────
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # ─────────────────────────────────────────────
      # 11. APK RELEASE
      # ─────────────────────────────────────────────
      - name: Build Release APK
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace


      # ─────────────────────────────────────────────
      # 12. AAB Google Play
      # ─────────────────────────────────────────────
      - name: Build Release AAB
        run: |
          gradle :app:bundleRelease \
            --no-daemon \
            --stacktrace


      # ─────────────────────────────────────────────
      # 13. Mostrar resultados
      # ─────────────────────────────────────────────
      - name: Show generated files
        shell: bash
        run: |
          echo ""
          echo "===== BUILD OUTPUTS ====="

          find app/build/outputs \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print


      # ─────────────────────────────────────────────
      # 14. Subir APK + AAB
      # ─────────────────────────────────────────────
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: JsTvRemote-1.3.1-builds
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
