name: Android CI - Js TV Remote

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Fix app folder
        shell: bash
        run: |
          echo "Checking project folders..."

          if [ -d "app 2" ] && [ ! -d "app" ]; then
            mv "app 2" app
            echo "Renamed 'app 2' to 'app'."
          elif [ -d "app" ]; then
            echo "Folder 'app' already exists."
          else
            echo "ERROR: No app folder found."
            echo "Project contents:"
            ls -la
            exit 1
          fi

      - name: Check project
        shell: bash
        run: |
          echo "Checking required files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Project structure:"
          find . -maxdepth 2 -type f | sort

          echo "Project structure OK."

      - name: Show Java and Gradle versions
        run: |
          java -version
          gradle --version

      - name: Lint
        run: gradle :app:lint --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build Release AAB
        run: gradle :app:bundleRelease --no-daemon --stacktrace

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: JsTvRemote-builds
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
